resources:
  jobs:
    DABs_Demo:
      name: "[${bundle.target}] DABs Demo"
      tasks:
        - task_key: users
          notebook_task:
            notebook_path: data_ingestion_users
            source: GIT
        - task_key: shows
          depends_on:
            - task_key: users
          notebook_task:
            notebook_path: data_ingestion_shows
            source: GIT
        - task_key: viewership
          depends_on:
            - task_key: shows
          notebook_task:
            notebook_path: data_ingestion_viewership
            source: GIT
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: HOURS
      git_source:
        git_url: https://github.com/jaymehtadadb/dq-ingestion-notebooks.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      performance_target: PERFORMANCE_OPTIMIZED

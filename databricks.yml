bundle:
  name: dq-ingestion-bundle

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog name for DQ tables"
    default: "nbcu"
  schema:
    description: "Schema name for DQ tables"
    default: "peacock"

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: DEFAULT

  prod:
    mode: production
    workspace:
      profile: DEFAULT

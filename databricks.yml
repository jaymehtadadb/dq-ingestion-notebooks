bundle:
  name: dq-ingestion-bundle

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog name for DQ tables"
    default: "nbcu"
  schema:
    description: "Schema name for DQ tables"
    default: "peacock"

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: anil-workspace

  prod:
    mode: production
    workspace:
      profile: e2-demo-west
      root_path: /Workspace/Users/jay.mehta@databricks.com/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        DABs_Demo:
          trigger:
            pause_status: PAUSED
